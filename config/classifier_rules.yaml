scores:
  official_full_playlist: 6
  primary_official_channel: 4
  exact_show_alias: 4
  numbered_episode: 4
  plausible_duration: 2
  hard_exclusion: -15
  unofficial_channel: -8
  abnormal_duration: -5
threshold_high: 8
threshold_low: 0
broad_min_duration_seconds: 1500
annual_min_duration_seconds: 9000
video_types:
  hard:
    preview:
      - "\\b(?:teaser|trailer|preview|xem truoc|hong tap|sanh cho)\\b"
    recap:
      - "\\b(?:recap|replay|nhin lai|hoi uc|tien truyen)\\b"
      - "tuyen tap khoanh khac"
    backstage:
      - "\\b(?:behind the scenes|bts|hau truong|rehearsal)\\b"
      - "toan canh tap nhay"
      - "hanh trinh \\d+ ngay.*hoan thien"
    compilation:
      - "\\b(?:compilation|full setlist|tuyen tap|tong hop)\\b"
      - "\\btron bo \\d+ tiet muc\\b"
      - "\\bfull \\d+ tiet muc\\b"
      - "\\bplaylist full \\d+ tiet muc\\b"
      - "\\btop \\d+ (?:hit|ban|tiet muc)\\b"
      - "^(?!.*\\btap \\d).*(?:^top|\\bnhung .* top) \\d+\\b"
      - "\\bhanh trinh .* tai sao nhap ngu\\b"
    music_asset:
      - "\\b(?:official mv|music video|lyric|lyrics|audio|1 hour)\\b"
      - "\\bfull demo bai hat\\b"
    clip_or_segment:
      - "^(?:game|say song|hai tet|full hai|kich song|bi mat gia toc|dong hanh)\\b"
      - "\\bkhong len song\\b"
    special_extra:
      - "\\btap dac biet\\b"
  soft:
    performance:
      - "\\b(?:performance|tiet muc|live ?stage|liveshow|concert)\\b"
    interview:
      - "\\binterview\\b"
  # These labels expand discovery without changing a previously accepted numbered
  # canonical episode. Canonical overlaps are emitted as NEEDS_REVIEW downstream.
  observational:
    short_form:
      - "\\bshorts?\\b"
    promo:
      - "\\b(?:promo|don xem|coming soon)\\b"
    highlight:
      - "\\b(?:highlight|best moments?|top moments?|khoanh khac)\\b"
    reaction_commentary:
      - "\\b(?:reaction|binh luan|phan tich)\\b"
    uncut_extended:
      - "\\b(?:uncut|extended|deleted scene|canh bi cat)\\b"
    production_diary:
      - "\\b(?:backstage|making of|nhat ky phong tap)\\b"
    dance_practice:
      - "\\b(?:dance practice|line distribution|tap nhay)\\b"
    interview_press:
      - "\\b(?:phong van|hop bao|le ra mat|press conference)\\b"
    cast_content:
      - "\\b(?:cast diary|cast vlog|nhat ky|thu thach|challenge)\\b"
    ost_theme:
      - "\\b(?:ost|theme song|lyric video|official audio)\\b"
    livestream:
      - "\\b(?:livestream|live stream|truc tiep)\\b"

